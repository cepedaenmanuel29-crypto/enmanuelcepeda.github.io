<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff; /* light blue background */
            color: #333;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #003366;
            margin-bottom: 40px;
        }

        section {
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        /* Different colors for each section */
        #microgrid {
            background-color: #e6f0ff; /* light blue */
        }

        #lab {
            background-color: #e6ffe6; /* light green */
        }

        #ch1 {
            background-color: #fffbe6; /* light yellow */
        }

        h2 {
            margin-top: 0;
        }

        p {
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Project Dashboard</h1>

    <!-- Microgrid Section -->
    <section id="microgrid">
        <h2>Microgrid Project</h2>
        <p>This is the Microgrid section. Add your content and images here.</p>
    </section>

    <!-- Lab Section -->
    <section id="lab">
        <h2>Lab Project</h2>
        <p>This is the Lab section. Add your content and images here.</p>
    </section>

    <!-- Chapter 1 Section -->
    <section id="ch1">
        <h2>Chapter 1</h2>
        <p>This is Chapter 1 section. Add your content and images here.</p>
    </section>

</body>
</html>
