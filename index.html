    <style>
        /* General body style */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f5;
            text-align: center;
            padding: 40px;
        }

        /* Page title */
        h1 {
            color: #333366;
            margin-bottom: 50px;
        }

        /* Buttons for folders */
        .folder-link {
            display: inline-block;
            margin: 20px;
            padding: 20px 35px;
            background-color: #6666ff;
            color: white;
            font-size: 18px;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Hover effect */
        .folder-link:hover {
            background-color: #4444cc;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        /* Footer text */
        footer {
            margin-top: 60px;
            font-size: 14px;
            color: #555;
        }
