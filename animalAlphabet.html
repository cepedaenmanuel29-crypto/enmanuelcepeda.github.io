<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Animal Alphabet - A to E</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/3069/3069172.png">

    <style>
        /* Estilos Generales */
        body {
            font-family: 'Fredoka', sans-serif;
            text-align: center;
            background-color: #f0faff;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 { color: #ff6f61; font-size: 3rem; margin-bottom: 10px; }

        /* Navegación: Requisito de Hover y sin subrayado */
        nav {
            background: white;
            padding: 15px;
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        nav a {
            text-decoration: none; /* Sin subrayado */
            font-size: 24px;
            font-weight: 600;
            color: #444;
            padding: 10px 20px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background-color: #ffde59; /* Cambio de color al pasar el mouse */
            color: #000;
        }

        /* GRID LAYOUT: 3 celdas por fila */
        .animal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columnas iguales */
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .card:hover { transform: translateY(-5px); }

        .card h2 { margin-top: 0; color: #4b86b4; }

        /* Imágenes de los animales */
        .animal-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        /* Icono de construcción */
        .status-icon {
            width: 60px;
            margin-top: 10px;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
        }

        .back-link {
            text-decoration: none;
            background: #4b86b4;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header id="top">
        <h1>My Animal Alphabet</h1>
        <nav>
            <a href="#animal-a">A</a> | 
            <a href="#animal-b">B</a> | 
            <a href="#animal-c">C</a> | 
            <a href="#animal-d">D</a> | 
            <a href="#animal-e">E</a>
        </nav>
    </header>

    <main class="animal-grid">
        
        <section id="animal-a" class="card">
            <h2>A is for Anteater</h2>
            <img src="https://images.unsplash.com/photo-1551009175-15bdf9dcb580?auto=format&fit=crop&w=400" alt="Anteater" class="animal-img">
            <audio controls style="width: 100%;">
                <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>
        </section>

        <section id="animal-b" class="card">
            <h2>B is for Bear</h2>
            <img src="https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?auto=format&fit=crop&w=400" alt="Bear" class="animal-img">
            <img src="https://cdn-icons-png.flaticon.com/128/3159/3159424.png" class="status-icon" alt="Under Construction">
        </section>

        <section id="animal-c" class="card">
            <h2>C is for Cat</h2>
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400" alt="Cat" class="animal-img">
            <img src="https://cdn-icons-png.flaticon.com/128/3159/3159424.png" class="status-icon" alt="Under Construction">
        </section>

        <section id="animal-d" class="card">
            <h2>D is for Dolphin</h2>
            <img src="https://images.unsplash.com/photo-1607305382272-6237ba7e6a84?auto=format&fit=crop&w=400" alt="Dolphin" class="animal-img">
            <img src="https://cdn-icons-png.flaticon.com/128/3159/3159424.png" class="status-icon" alt="Under Construction">
        </section>

        <section id="animal-e" class="card">
            <h2>E is for Elephant</h2>
            <img src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?auto=format&fit=crop&w=400" alt="Elephant" class="animal-img">
            <img src="https://cdn-icons-png.flaticon.com/128/3159/3159424.png" class="status-icon" alt="Under Construction">
        </section>

    </main>

    <footer>
        <a href="#top" class="back-link">Back to the top of the page</a>
    </footer>

</body>
</html>
