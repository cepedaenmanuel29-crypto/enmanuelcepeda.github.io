<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animal Alphabet - A to E</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/616/616408.png">

<style>

body{
font-family:'Fredoka One', cursive;
background-color:#e0f7fa;
text-align:center;
margin:0;
padding:20px;
}

nav{
margin-bottom:30px;
font-size:30px;
}

nav a{
text-decoration:none;
color:#ef6c00;
padding:10px 15px;
transition:0.3s;
}

nav a:hover{
background-color:#ffffff;
border-radius:15px;
}

.grid-container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
max-width:1000px;
margin:0 auto;
}

.card{
background:white;
border-radius:20px;
padding:15px;
border:4px solid #ffa726;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
}

audio{
margin-top:10px;
width:100%;
}

.icon-small{
width:40px;
height:40px;
margin-top:10px;
}

footer{
margin-top:40px;
}

.top-link{
text-decoration:none;
color:#00796b;
font-weight:bold;
}

</style>
</head>

<body>

<header id="top">
<h1>Animal Alphabet</h1>

<nav>
<a href="#a">A</a> |
<a href="#b">B</a> |
<a href="#c">C</a> |
<a href="#d">D</a> |
<a href="#e">E</a>
</nav>

</header>

<div class="grid-container">

<section id="a" class="card">
<h3>A is for Giraffe</h3>

<img src="https://upload.wikimedia.org/wikipedia/commons/9/9f/Giraffe_standing.jpg" alt="Giraffe">

<audio controls>
<source src="https://www.soundjay.com/animal/horse-neigh-1.mp3" type="audio/mpeg">
</audio>

</section>

<section id="b" class="card">
<h3>B is for Bear</h3>

<img src="https://upload.wikimedia.org/wikipedia/commons/7/71/2010-kodiak-bear-1.jpg" alt="Bear">

<audio controls>
<source src="https://www.soundjay.com/animal/bear-1.mp3" type="audio/mpeg">
</audio>

</section>

<section id="c" class="card">
<h3>C is for Cat</h3>

<img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg" alt="Cat">

<audio controls>
<source src="https://www.soundjay.com/animal/cat-meow-2.mp3" type="audio/mpeg">
</audio>

</section>

<section id="d" class="card">
<h3>D is for Dog</h3>

<img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/German_Shepherd_-_DSC_0346_%2810096362833%29.jpg" alt="Dog">

<audio controls>
<source src="https://www.soundjay.com/animal/dog-bark-1.mp3" type="audio/mpeg">
</audio>

</section>

<section id="e" class="card">
<h3>E is for Elephant</h3>

<img src="https://upload.wikimedia.org/wikipedia/commons/3/37/African_Bush_Elephant.jpg" alt="Elephant">

<audio controls>
<source src="https://www.soundjay.com/animal/elephant-1.mp3" type="audio/mpeg">
</audio>

<br>
<img src="https://cdn-icons-png.flaticon.com/128/3159/3159424.png" class="icon-small">

</section>

</div>

<footer>
<a href="#top" class="top-link">Back to the top of the page</a>
</footer>

</body>
</html>
